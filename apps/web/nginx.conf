server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html —
    # sem isso, atualizar a página em /mapa ou /contatos/:id dá 404 (o
    # roteamento é do React Router, no navegador, o nginx não sabe dessas
    # rotas).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
